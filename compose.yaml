name: oficina-billing

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina_billing}
      POSTGRES_USER: ${DB_USERNAME:-billing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    volumes:
      - billing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  billing:
    build: .
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina_billing}
      DB_USERNAME: ${DB_USERNAME:-billing}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
      BILLING_SECURITY_USERNAME: ${BILLING_SECURITY_USERNAME:-billing}
      BILLING_SECURITY_PASSWORD: ${BILLING_SECURITY_PASSWORD:?Defina BILLING_SECURITY_PASSWORD no .env}
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

volumes:
  billing-postgres-data:
