services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: oficina_billing
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ${CI_PASSWORD:?Set ephemeral CI_PASSWORD}
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 3s
      timeout: 5s
      retries: 40
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ci
      RABBITMQ_DEFAULT_PASS: ${CI_PASSWORD:?Set ephemeral CI_PASSWORD}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: '+S 2:2'
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 5s
      retries: 40
  billing:
    image: ${CI_IMAGE:?Set CI_IMAGE}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: oficina_billing
      DB_USERNAME: ci
      DB_PASSWORD: ${CI_PASSWORD:?Set ephemeral CI_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ci
      RABBITMQ_PASSWORD: ${CI_PASSWORD:?Set ephemeral CI_PASSWORD}
      BILLING_JWT_ISSUER: https://auth.invalid
      BILLING_JWT_AUDIENCE: oficina
      BILLING_JWKS_URI: https://auth.invalid/jwks
      MERCADO_PAGO_ENABLED: 'false'
      MERCADO_PAGO_RECONCILIATION_ENABLED: 'false'
networks:
  default:
    internal: true
