name: Billing CI

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Test CI scripts
        run: python3 -B -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Secrets, Maven, coverage, Docker and runtime
        run: python3 -B scripts/ci/verify.py --output "$RUNNER_TEMP/billing-verification"
      - name: SonarCloud analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QG_WAIT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error::SONAR_TOKEN está vazio. Configure o secret SONAR_TOKEN para executar a análise SonarCloud."
            exit 1
          fi
          chmod +x mvnw
          ./mvnw -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization=auronet0 \
            -Dsonar.projectKey=AuroNet0_tech-challenge-oficina-billing-service \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.qualitygate.wait="$QG_WAIT"
      - name: Collect job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'billing-verification'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'job.json').write_text(json.dumps({
              'revision': os.environ['GITHUB_SHA'],
              'status_before_collection': os.environ['JOB_STATUS'],
              'verification_report_present': (output / 'verification.json').is_file(),
          }) + '\n')
          PY
      - name: Upload sanitized reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: billing-ci-${{ github.sha }}
          path: ${{ runner.temp }}/billing-verification/*.json
          if-no-files-found: error
          retention-days: 7
